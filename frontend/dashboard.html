<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>NexlyticX workspace</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/theme.js"></script>
</head>
<body>
<div class="shell">

  <aside class="sidebar" aria-label="Main navigation">
    <a class="sidebar-brand" href="/">Nexlytic<span>X</span></a>

    <div class="nav-group-label">Workflow</div>
    <nav class="primary-nav">
      <a class="nav-item" data-view="workspace" href="#/workspace"><span data-icon="grid" data-class="nav-icon"></span><span class="nav-label">Workspace</span></a>
      <a class="nav-item" data-view="upload" href="#/upload"><span data-icon="upload" data-class="nav-icon"></span><span class="nav-label">Upload data</span></a>
      <a class="nav-item" data-view="clean" href="#/clean"><span data-icon="filter" data-class="nav-icon"></span><span class="nav-label">Clean &amp; prep</span><span class="nav-badge" id="clean-badge" hidden></span></a>
      <a class="nav-item" data-view="explore" href="#/explore"><span data-icon="search" data-class="nav-icon"></span><span class="nav-label">Explore (EDA)</span></a>
      <a class="nav-item" data-view="visualize" href="#/visualize"><span data-icon="chart" data-class="nav-icon"></span><span class="nav-label">Visualize</span></a>
      <a class="nav-item" data-view="copilot" href="#/copilot"><span data-icon="chat" data-class="nav-icon"></span><span class="nav-label">Copilot</span></a>
    </nav>

    <div class="nav-divider"></div>
    <div class="nav-group-label">Review</div>
    <nav class="primary-nav">
      <a class="nav-item" data-view="trust" href="#/trust"><span data-icon="shield" data-class="nav-icon"></span><span class="nav-label">Trust score</span></a>
      <a class="nav-item" data-view="reports" href="#/reports"><span data-icon="doc" data-class="nav-icon"></span><span class="nav-label">Reports</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="privacy-note" id="privacy-note"></div>
      <div id="sidebar-account"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <select id="ds-select" class="select ds-select" aria-label="Active dataset" hidden></select>
        <span class="topbar-meta" id="topbar-meta"></span>
      </div>
      <div class="topbar-actions">
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <span data-icon="moon" data-class="icon-moon"></span><span data-icon="sun" data-class="icon-sun"></span>
        </button>
        <button class="btn btn-secondary btn-sm" id="upload-btn" type="button">Upload CSV</button>
        <button class="btn btn-primary btn-sm" id="export-btn" type="button" disabled>Export report</button>
      </div>
    </header>

    <main class="content">
      <div class="guest-banner" id="guest-banner" hidden></div>
      <section class="view" id="view-workspace"></section>
      <section class="view" id="view-upload"></section>
      <section class="view" id="view-clean"></section>
      <section class="view" id="view-explore"></section>
      <section class="view" id="view-visualize"></section>
      <section class="view" id="view-copilot"></section>
      <section class="view" id="view-trust"></section>
      <section class="view" id="view-reports"></section>
      <section class="view" id="view-account"></section>
    </main>
  </div>
</div>

<input type="file" id="file-input" accept=".csv,.tsv,.txt,text/csv" hidden>

<script src="/js/core.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/copilot.js"></script>
<script src="/js/views/workspace.js"></script>
<script src="/js/views/upload.js"></script>
<script src="/js/views/clean.js"></script>
<script src="/js/views/explore.js"></script>
<script src="/js/views/visualize.js"></script>
<script src="/js/views/copilotpage.js"></script>
<script src="/js/views/trust.js"></script>
<script src="/js/views/reports.js"></script>
<script src="/js/views/account.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
